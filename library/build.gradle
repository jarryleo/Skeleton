plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'io.rmiri.skeleton'
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }
    buildFeatures {
        // CLog reads BuildConfig.DEBUG
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    publishing {
        // Registers the SoftwareComponent that the Maven publication below consumes.
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

// Publishing: JitPack runs `./gradlew :library:publishToMavenLocal` (see
// jitpack.yml) and republishes the result as com.github.rasoulmiri:Skeleton:<git-tag>.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.rasoulmiri'
                artifactId = 'Skeleton'
                version = '1.1.5'
            }
        }
    }
}
